services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coffee-machine-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - database
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - coffee-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coffee-machine-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - coffee-network

  database:
    image: postgres:16-alpine
    container_name: coffee-machine-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: coffee_user
      POSTGRES_PASSWORD: coffee_password
      POSTGRES_DB: coffee_machine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coffee-network

  redis:
    image: redis:7-alpine
    container_name: coffee-machine-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - coffee-network

volumes:
  postgres_data:
  redis_data:

networks:
  coffee-network:
    driver: bridge
