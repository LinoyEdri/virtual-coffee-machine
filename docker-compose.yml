services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coffee-machine-backend
    restart: unless-stopped
    ports:
      # host:container -- API reachable at http://localhost:3333
      - "3333:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      # A container cannot see its own published host port, so tell it.
      # Used only for log output. Must match the host side of `ports` above.
      PUBLIC_URL: http://localhost:3333
      # `database` is the compose service name. Docker's embedded DNS
      # resolves it to that container on the shared network, so the
      # backend never needs to know an IP address.
      DB_HOST: database
      DB_PORT: 5432
      # These read from the SAME variables the database service uses, so
      # the two can never disagree. Change them in the root .env file.
      DB_NAME: ${POSTGRES_DB:-coffee_machine}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?required - set it in .env, see .env.example}
      # Secrets use `:?` instead of a default, so no working credential
      # is ever committed in this file.
      BOSS_PASSWORD: ${BOSS_PASSWORD:?required - set it in .env, see .env.example}
      # Defines month boundaries for the monthly report.
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Jerusalem}
      # `redis` is the compose service name; Docker's DNS resolves it.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # How long the consumer simulates brewing a coffee.
      PREPARATION_SECONDS: ${PREPARATION_SECONDS:-10}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - coffee-network

  # Queue consumer (requirement 4.1.3). Same image and same codebase as
  # the backend - only the start command differs, so it runs src/worker.ts
  # instead of src/server.ts. It serves no HTTP, so it publishes no ports.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coffee-machine-worker
    restart: unless-stopped
    # Runs tsx directly rather than `tsx watch`. The watcher supervises a
    # child process and exits immediately on SIGTERM, killing the child
    # before it can drain - which left an order stuck on 'preparing'.
    # Running the process directly means the shutdown handler in
    # worker.ts is what actually decides when to exit.
    command: npx tsx src/worker.ts
    # How long Docker waits after SIGTERM before SIGKILL. MUST exceed
    # PREPARATION_SECONDS, or a coffee still brewing gets killed halfway.
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-30s}
    environment:
      NODE_ENV: development
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-coffee_machine}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?required - set it in .env, see .env.example}
      # Required by env.ts at startup, even though the worker itself
      # never verifies a boss password.
      BOSS_PASSWORD: ${BOSS_PASSWORD:?required - set it in .env, see .env.example}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Jerusalem}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PREPARATION_SECONDS: ${PREPARATION_SECONDS:-10}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - coffee-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coffee-machine-frontend
    restart: unless-stopped
    ports:
      # host:container -- app reachable at http://localhost:3000
      - "3000:5173"
    environment:
      # Consumed by Vite in the browser, so it must be a host-reachable URL
      VITE_API_URL: http://localhost:3333
      # Printed in the startup banner. Must match the host side of `ports` above.
      PUBLIC_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - coffee-network

  database:
    image: postgres:18-alpine
    container_name: coffee-machine-database
    restart: unless-stopped
    environment:
      # Single source of truth for the credentials. Override them by
      # creating a `.env` file in the project root (see .env.example).
      # IMPORTANT: these only take effect when the data volume is EMPTY.
      # Changing them later requires `docker compose down -v` first.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # `:?` rather than a default: a working password must never be
      # committed to this file. Compose refuses to start and prints this
      # message if the variable is missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required - set it in .env, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-coffee_machine}
    ports:
      # Requires that no other PostgreSQL is using 5432 on this machine.
      - "5432:5432"
    volumes:
      # postgres:18 sets PGDATA to /var/lib/postgresql/18/docker,
      # so the parent directory is the correct mount point.
      - postgres_data:/var/lib/postgresql
    networks:
      - coffee-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-coffee_machine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: coffee-machine-redis
    restart: unless-stopped
    # appendonly: queued orders survive a restart (requirement 4.3.3)
    # noeviction: required by BullMQ -- Redis must never drop job keys
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - coffee-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:

networks:
  coffee-network:
    driver: bridge
